name: Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Validate game data lockstep
        run: node .github/scripts/validate.mjs
